name: Swiftlane
description: Swiftlane is a San Francisco-based physical security company providing cloud-based
  access control and video intercom systems for multifamily residential and commercial buildings.
  Its touchless, mobile-first platform combines face recognition, mobile and key-card credentials,
  visitor PIN access, vehicle readers, smart locks, and a centralized cloud management dashboard
  with access logs, user management, and remote unlock. Swiftlane publishes a customer product
  site, a large blog, and an Intercom-hosted help center, but exposes no public developer API,
  OpenAPI, SDKs, or webhooks; integrations are delivered through partners such as Okta, Azure,
  Google Workspace, and Eagle Eye.
